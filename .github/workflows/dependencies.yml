name: Dependency Updates

on:
  schedule:
    - cron: "0 0 * * MON" # Weekly on Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check for outdated packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security,llm,adapters]"
          pip list --outdated --format=json > outdated.json || true
          python -c "
          import json
          with open('outdated.json') as f:
              outdated = json.load(f)
          if outdated:
              print(f'{len(outdated)} packages have updates available:')
              for pkg in outdated:
                  print(f\"  {pkg['name']}: {pkg['version']} -> {pkg['latest_version']}\")
          else:
              print('All packages are up to date')
          "

      - name: Check for security vulnerabilities
        run: |
          pip install pip-audit
          pip-audit

      - name: Run tests with current dependencies
        run: python -m pytest tests/ -v --tb=short -q
