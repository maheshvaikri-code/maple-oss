name: Security Scan

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sundays

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"
          pip install pip-audit

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          set +e
          pip-audit --format=json --output=audit-report.json
          audit_report_exit=$?
          pip-audit
          audit_text_exit=$?
          if [ "$audit_report_exit" -ne 0 ]; then
            exit "$audit_report_exit"
          fi
          exit "$audit_text_exit"

      - name: Run bandit security scan
        run: |
          set +e
          bandit -r maple/ -f json -o bandit-report.json
          bandit_report_exit=$?
          if [ "$bandit_report_exit" -gt 1 ]; then
            exit "$bandit_report_exit"
          fi
          if [ ! -s bandit-report.json ]; then
            echo "Bandit did not produce a report" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          findings = report.get("results", [])
          blocking = [
              finding
              for finding in findings
              if finding.get("issue_severity", "").upper() in {"MEDIUM", "HIGH"}
          ]
          print(
              "Bandit findings: "
              f"{len(findings)} total, {len(blocking)} medium/high"
          )
          for finding in blocking:
              print(
                  f"{finding.get('filename')}:{finding.get('line_number')} "
                  f"{finding.get('test_id')}: {finding.get('issue_text')}"
              )
          sys.exit(1 if blocking else 0)
          PY

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-reports
          path: |
            audit-report.json
            bandit-report.json

      - name: Security summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency audit completed" >> $GITHUB_STEP_SUMMARY
          echo "- Static security analysis completed" >> $GITHUB_STEP_SUMMARY
