name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code formatting check
        run: black --check --diff maple/

      - name: Import sorting check
        run: isort --check-only --diff maple/

      # F401 (unused import), F811 (redefinition) and F841 (unused variable)
      # are real defect detectors and the tree is clean without them, so they
      # are NOT suppressed here. Only cosmetic rules that fight black are.
      - name: Lint with flake8
        run: |
          flake8 maple/ --max-line-length=88 --extend-ignore=E203,W503,W291,W293,E302,E402 --count --statistics

      - name: Type check with mypy
        run: mypy maple/ --ignore-missing-imports

      - name: Security check with bandit
        run: bandit -r maple/ -ll -q

      - name: License header check
        run: python tools/check_license_headers.py

      - name: Documentation check
        run: python tools/check_readme_sections.py

  runtime-quality:
    name: MAPLE runtime release preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install MAPLE with development and security extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,security,llm,adapters]"

      - name: Verify isolated dependencies
        run: python -m pip check

      - name: Compile and run network-free doctor
        run: |
          python -m compileall -q maple
          python -m maple.cli doctor --json

      - name: Lint changed runtime surface
        run: |
          python -m flake8 \
            maple/autonomy/workflow.py \
            maple/autonomy/contracts.py \
            maple/autonomy/execution.py \
            maple/autonomy/retrieval.py \
            maple/autonomy/events.py \
            maple/autonomy/evaluation.py \
            maple/autonomy/interop.py \
            maple/llm/capabilities.py \
            maple/cli.py \
            --max-line-length=88 \
            --extend-ignore=E203,W503,W291,W293,E302,E402 \
            --count --statistics

      - name: Run focused runtime regression
        run: python -m pytest tests/llm tests/autonomy tests/test_cli.py -q -o addopts=

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [lint, runtime-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix size — test 3.9 and 3.12 on all OS, others on Ubuntu only
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.8"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security,llm,adapters]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -q

      - name: Run tests with coverage (Ubuntu + Python 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pytest tests/ --cov=maple --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Verify install from wheel
        run: |
          pip install dist/*.whl
          python -m pip check
          python -m maple.cli doctor --json
          python -c "
          import maple
          from maple import Agent, Message, Config, Result
          from maple import AutonomousAgent, AutonomousConfig, LLMConfig
          from maple import Tool, ToolRegistry, MemoryManager
          print(f'MAPLE v{maple.__version__} installed successfully')
          print(f'All core imports verified')
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  nats:
    name: NATS transport (live server)
    runs-on: ubuntu-latest

    # The only place MAPLE's NATS code is actually executed. Everything else
    # about this transport is inspected rather than run, because a developer
    # machine has neither nats-py nor a server - which is exactly how it came
    # to be described instead of measured (ADR-161).
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install MAPLE with the nats extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[nats,dev]"

      - name: Wait for the server to accept connections
        run: |
          for i in $(seq 1 30); do
            if python -c "import socket,sys; s=socket.create_connection(('127.0.0.1',4222),2); s.close()" 2>/dev/null; then
              echo "NATS is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::NATS did not become reachable"; exit 1

      # -m nats selects the suite that is deselected by default. A skip here
      # would mean the server was unreachable, so --strict-markers plus the
      # explicit count check below makes "silently skipped" fail rather than
      # look green.
      - name: Measure the NATS transport against the server
        env:
          MAPLE_NATS_URL: nats://127.0.0.1:4222
        run: |
          python -m pytest tests/integration -m nats -v --no-cov -p no:cacheprovider             --junitxml=nats-results.xml

      - name: Fail if the suite skipped instead of running
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("nats-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"ran={total - skipped} skipped={skipped} of {total}")
          if total == 0 or skipped:
              print("::error::NATS tests skipped - the server was not reached, "
                    "so nothing was measured")
              sys.exit(1)
          PY

  summary:
    name: CI Summary
    needs: [lint, test, build, nats]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "**MAPLE release gates - Multi Agent Protocol Language Engine**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (multi-OS, multi-Python) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Package | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NATS transport (live) | ${{ needs.nats.result }} |" >> $GITHUB_STEP_SUMMARY

      # This job runs with `if: always()` so the table is written even when an
      # upstream job fails. Without the gate below it would then report success
      # regardless, and any branch protection requiring "CI Summary" would pass
      # over a red build. Fail explicitly on anything that is not success.
      - name: Fail if any required job did not succeed
        if: >-
          needs.lint.result != 'success' ||
          needs.test.result != 'success' ||
          needs.build.result != 'success' ||
          needs.nats.result != 'success'
        run: |
          echo "::error::CI gate failed - lint=${{ needs.lint.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} nats=${{ needs.nats.result }}"
          exit 1
