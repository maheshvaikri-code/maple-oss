name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
      confirmation:
        description: "Type I AUTHORIZE THIS PUBLISH to publish to Test PyPI"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "I AUTHORIZE THIS PUBLISH"

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify release tag matches package and changelog
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          package_version="$(python -c 'import maple; print(maple.__version__)')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Release tag $tag_version does not match package version $package_version" >&2
            exit 1
          fi
          python - "$tag_version" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines():
              if not line.startswith("## "):
                  continue
              heading = line[3:]
              if heading.startswith("Version "):
                  heading = heading[8:]
              if heading == version or heading.startswith(version + " "):
                  break
          else:
              raise SystemExit(f"CHANGELOG.md has no heading for version {version}")
          PY
          echo "Validated release version $tag_version"

      - name: Run tests before publish
        run: |
          pip install -e ".[dev,security]"
          python -m pip check
          python -m compileall -q maple
          python -m maple.cli doctor --json
          python -m pytest tests/ -v --tb=short -q

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Verify built wheel in the release environment
        run: |
          pip install dist/*.whl
          python -m pip check
          python -m maple.cli doctor --json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'testpypi' &&
      github.event.inputs.confirmation == 'I AUTHORIZE THIS PUBLISH'
    environment: testpypi

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release'
    environment: pypi

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  verify-install:
    name: Verify PyPI Install
    needs: publish-pypi
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for PyPI propagation
        run: sleep 60
        shell: bash

      - name: Install from PyPI
        run: pip install maple-oss

      - name: Verify installation
        run: |
          python -c "
          import maple
          from maple import Agent, Message, Config, Result
          from maple import AutonomousAgent, AutonomousConfig, LLMConfig
          print(f'MAPLE v{maple.__version__} installed from PyPI')
          print('All imports verified on ${{ matrix.os }}')
          "

      - name: Verify CLI
        run: maple --version || echo "CLI entry point check complete"
        shell: bash

  release-assets:
    name: Attach Release Assets
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        run: gh release upload ${{ github.ref_name }} dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
