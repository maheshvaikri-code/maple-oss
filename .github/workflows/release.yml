name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Job 1: When triggered by a tag push, create a GitHub Release from the tag
  release-from-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"
          pip install build twine
          python -m pip check
          python -m compileall -q maple
          python -m maple.cli doctor --json

      - name: Verify tag matches package and changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          package_version="$(python -c 'import maple; print(maple.__version__)')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Release tag $tag_version does not match package version $package_version" >&2
            exit 1
          fi
          python - "$tag_version" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines():
              if not line.startswith("## "):
                  continue
              heading = line[3:]
              if heading.startswith("Version "):
                  heading = heading[8:]
              if heading == version or heading.startswith(version + " "):
                  break
          else:
              raise SystemExit(f"CHANGELOG.md has no heading for version {version}")
          PY
          echo "Validated release version $tag_version"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -q

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          cat > release_notes.md << EOF
          # MAPLE v${{ env.VERSION }}

          **Multi Agent Protocol Language Engine**
          **Creator: Mahesh Vaijainthymala Krishnamoorthy (Mahesh Vaikri)**

          ## Installation

          \`\`\`bash
          pip install maple-oss==${{ env.VERSION }}
          \`\`\`

          ## What's Changed

          See [CHANGELOG.md](https://github.com/maheshvaikri-code/maple-oss/blob/main/CHANGELOG.md) for detailed changes.
          EOF

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "MAPLE v${{ env.VERSION }}" \
            --notes-file release_notes.md \
            --latest \
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
